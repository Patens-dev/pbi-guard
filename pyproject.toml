[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pbi-guard"
version = "0.2.0"
description = "Power BI TMDL Static Analysis and Contract Testing Runner"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
pbi-guard = "pbi_guard.cli:main"