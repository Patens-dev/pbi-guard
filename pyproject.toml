[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pbi-guard"
version = "0.1.0"
description = "Lightweight CI/CD assertion and logic tester for Power BI TMDL models"
readme = "README.md"
authors = [{ name = "patens" }]
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
pbi-guard = "main:main"